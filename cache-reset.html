<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music 63 cache reset</title><style>body{font:16px system-ui,sans-serif;max-width:720px;margin:64px auto;padding:0 20px;background:#0d1726;color:#eef6ff}.box{padding:24px;border:1px solid #35506f;border-radius:16px;background:#152740}b{display:block;font-size:22px;margin-bottom:8px}</style></head><body><div class="box"><b>Music 63 — clearing old app cache…</b><div id="status">Please wait.</div></div><script>(async()=>{const s=document.getElementById('status');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('music63-')).map(k=>caches.delete(k)))}s.textContent='Done. Loading the corrected version…';setTimeout(()=>location.replace('index.php?cachefix='+Date.now()),400)}catch(e){s.textContent='Cache reset could not complete: '+e.message+' — use Ctrl+Shift+R / Ctrl+F5, then reload index.php.'}})();</script></body></html>
